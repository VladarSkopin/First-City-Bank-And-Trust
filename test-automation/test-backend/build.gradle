plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'  // Add Allure plugin here
}

group = 'org.skopintsev'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// Allure configuration specific to this module
allure {
    version = '2.24.0'

    // Use autoconfigure for JUnit 5
    autoconfigure = true

    // Specify adapter
    adapter {
        allureJavaVersion = '2.24.0'
        frameworks {
            junit5 {
                adapterVersion = '2.24.0'
            }
        }
    }
}

dependencies {
    // ========== PRODUCTION DEPENDENCIES ==========
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.3'
    implementation 'io.rest-assured:rest-assured:5.4.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'io.qameta.allure:allure-rest-assured:2.24.0'
    runtimeOnly 'org.postgresql:postgresql:42.6.0'

    // ========== TEST DEPENDENCIES ==========
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Allure dependencies - CRITICAL for reporting
    testImplementation 'io.qameta.allure:allure-junit5:2.24.0'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'org.hamcrest:hamcrest:2.2'
}

test {
    useJUnitPlatform()

    // FIXED: Use relative path, not absolute
    systemProperty 'allure.results.directory', "${buildDir}/allure-results"

    // Ensure tests are always run to generate results
    outputs.upToDateWhen { false }

    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}